name: CI
on:
  # pull_request:
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'test.configs/**'
  #     - '.vscode/'
  #     - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'
  # Lets the pipeline be started by hand, for example when the signing
  # secrets have been added.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      upload-artifact: ${{ github.event_name == 'push' }}
      # The build workflow cannot ask for a secret in an "if", so it gets
      # told whether the signing secrets are there. Without them the
      # artifacts are unsigned.
      sign-apple: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      sign-android: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
      sign-windows: ${{ secrets.WINDOWS_SIGNING_KEY != '' }}
      
