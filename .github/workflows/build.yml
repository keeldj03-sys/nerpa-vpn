name: Build
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.44.8'
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_gz: "Hiddify-Linux-x64-AppImage.tar"
  TARGET_NAME_AppImage: "Hiddify-Linux-x64-AppImage"
  TARGET_NAME_deb: "Hiddify-Debian-x64"
  # TARGET_NAME_rpm: "Hiddify-rpm-x64"
  TARGET_NAME_apk: "Hiddify-Android"
  TARGET_NAME_aab: "Hiddify-Android"
  TARGET_NAME_exe: "Hiddify-Windows-Setup-x64"
  TARGET_NAME_msix: "Hiddify-Windows-x64"
  TARGET_NAME_zip: "Hiddify-Windows-Portable-x64"
  TARGET_NAME_dmg: "Hiddify-MacOS"
  TARGET_NAME_pkg: "Hiddify-MacOS-Installer"
  TARGET_NAME_ipa: "Hiddify-iOS"
  

jobs:
  core:
    name: Build core
    # The core is built from the hiddify-core submodule, so the app is
    # linked against our own core. The upstream prebuilt binaries do not
    # carry the Nerpa core changes (user rule-sets, per-group outbound
    # selection).
    #
    # The core is built on Linux for the Linux, Windows and Android
    # targets: the core Makefile drives shell scripts and the cronet
    # toolchain, and cross-compiling from Linux is what hiddify-core does
    # upstream. The macOS target needs the Apple toolchain (darwin clang,
    # lipo), so it is built on a macOS runner instead.
    permissions: write-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'hiddify-lib-linux-amd64', target: 'linux-amd64', arch: 'amd64', os: 'ubuntu-22.04' }
          - { name: 'hiddify-lib-windows-amd64', target: 'windows-amd64', aarch: 'x64', os: 'ubuntu-22.04' }
          - { name: 'hiddify-lib-android', target: 'android', arch: 'arm64', os: 'ubuntu-22.04' }
          - { name: 'hiddify-lib-macos', target: 'macos', arch: 'amd64', os: 'macos-15' }
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'hiddify-core/go.mod'
          check-latest: false

      - name: Setup MinGW
        if: endsWith(matrix.target,'windows-amd64')
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: ${{ matrix.aarch }}

      - name: Setup macOS tools
        if: matrix.target == 'macos'
        run: |
          # The core Makefile uses the GNU coreutils, which the macOS runner
          # does not provide by default.
          brew install coreutils

      - name: Setup Java
        if: matrix.target == 'android'
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        if: matrix.target == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup Node
        if: matrix.target == 'android'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Go modules
        if: startsWith(matrix.target, 'linux')
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-${{ matrix.target }}-${{ hashFiles('hiddify-core/go.sum') }}
          restore-keys: |
            go-${{ matrix.target }}-

      - name: Cache Chromium toolchain
        if: startsWith(matrix.target, 'linux')
        id: cache-chromium-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ./cronet-go/naiveproxy/src/third_party/llvm-build/Release+Asserts
            ./cronet-go/naiveproxy/src/out/sysroot-build
          key: chromium-toolchain-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('hiddify-core/hiddify-sing-box/.github/CRONET_GO_VERSION') }}

      - name: Build core
        working-directory: hiddify-core
        env:
          # The core Makefile sets GOOS and GOARCH for the target itself.
          # They must not be set here: "go install" would then build the
          # tools (gomobile, gobind) for the target architecture, and they
          # could not run on the build machine.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          # gomobile and gobind are installed by the core Makefile into
          # $(go env GOPATH)/bin, which is not on the PATH by default.
          # The Makefile installs them and calls gomobile in the same
          # recipe, so the PATH has to be set before make runs.
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          # The linux build links against the cronet library, which has to
          # be built first. It downloads a Chromium toolchain, so it takes
          # a while.
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            make cronet-amd64
          fi

          # The module proxy drops connections from time to time. Retry the
          # download so a flaky network does not fail the whole build.
          for attempt in 1 2 3; do
            if make ${{ matrix.target }}; then
              echo "core built on attempt $attempt"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "core build failed after 3 attempts"
              exit 1
            fi
            echo "attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          echo "--- core artifacts ---"
          find bin -type f | head -20

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: hiddify-core/bin
          retention-days: 1

  test:
    outputs:
      draftBuildCode: ${{ steps.draftBuildCode.outputs.datetime }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The proto files live in the hiddify-core submodule, and the
          # code generation reads them.
          submodules: 'recursive'
      - uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Prepare
        # The tests only need the generated code and the translations, not
        # the core library. Building the core here would only slow the
        # test job down, and the "core" job builds it for the app.
        run: make common-prepare
      - name: Test
        run: flutter test

      - name: make draftBuildCode
        id: draftBuildCode
        run: echo "::set-output name=datetime::$(date +'%d.%H.%M')"


  build:
    needs: [test, core]
    permissions: write-all
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-apk
            os: ubuntu-latest
            targets: apk
            core_artifact: hiddify-lib-android

          # - platform: android-aab
          #   os: ubuntu-latest
          #   targets: aab

          - platform: windows
            os: windows-latest
            aarch: amd64
            targets: exe,msix,zip
            core_artifact: hiddify-lib-windows-amd64

          - platform: linux
            os: ubuntu-22.04
            aarch: amd64
            targets: deb,gz,AppImage
            core_artifact: hiddify-lib-linux-amd64

          # - platform: linux-amd64
          #   os: ubuntu-22.04
          #   aarch: amd64
          #   targets: deb,gz

          # - platform: linux-arm64
          #   os: ubuntu-24.04-arm
          #   aarch: arm64
          #   targets: deb,gz

          # - platform: linux-amd64-musl
          #   os: ubuntu-22.04
          #   aarch: amd64
          #   targets: deb,gz

          # - platform: linux-arm64-musl
          #   os: ubuntu-24.04-arm
          #   aarch: arm64
          #   targets: deb,gz
            
          - platform: macos
            os: macos-15
            aarch: universal
            targets: dmg,pkg
            core_artifact: hiddify-lib-macos
            
          # - platform: ios
          #   os: macos-15
          #   aarch: universal
          #   filename: hiddify-ios
          #   targets: ipa
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          # The core comes from the "core" job, built from the hiddify-core
          # submodule. The submodules are not needed here, but the proto
          # files are, and they live in the same submodule.
          submodules: 'recursive'
          fetch-depth: 0

      - name: Import Apple Codesign Certificates
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        # A called workflow may only use "inputs" in an "if", so the secret
        # is checked inside the step. Without a certificate the build still
        # runs, it just produces an unsigned artifact.
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "no Apple certificate, building unsigned"
            exit 0
          fi
          echo "${{ secrets.APPLE_CERTIFICATE_P12 }}" | base64 --decode > "$RUNNER_TEMP/nerpa.p12"
          echo "${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}" > "$RUNNER_TEMP/nerpa.p12.pass"
          security create-keychain -p "" signing_temp.keychain
          security default-keychain -s signing_temp.keychain
          security unlock-keychain -p "" signing_temp.keychain
          security import "$RUNNER_TEMP/nerpa.p12" -k signing_temp.keychain -P "$(cat "$RUNNER_TEMP/nerpa.p12.pass")" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" signing_temp.keychain
          rm -f "$RUNNER_TEMP/nerpa.p12" "$RUNNER_TEMP/nerpa.p12.pass"
          security find-identity -v -p codesigning

      - name: Import Apple Mobile Provisioning Profile
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        # Without a profile the build still runs, it just produces an
        # unsigned artifact. A called workflow may only use "inputs" in an
        # "if", so the secret is checked inside the step.
        env:
          HAS_PROFILE: ${{ secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64 != '' }}
        run: |
           if [ "$HAS_PROFILE" != "true" ]; then
             echo "no Apple provisioning profile, building unsigned"
             exit 0
           fi
           mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
           echo "${{secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
           ls ~/Library/MobileDevice/Provisioning\ Profiles
           security unlock-keychain -p "" signing_temp.keychain
           security find-identity -v -p codesigning
        #   ls ~/Library/MobileDevice/Provisioning\ Profiles
        #   echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARXZ_BASE64}}"|base64 --decode | tar xJ -C ~/Library/MobileDevice/Provisioning\ Profiles
        #   # echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64_2}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
          


      # - name: Setup Flutter for arm64
      #   if: ${{ startsWith(matrix.platform,'linux-arm64') }}
      #   uses: hurelhuyag/flutter-arm64-action@HEAD
      #   with:
      #     channel: 'stable'
      #     flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Clean up disk space
        if: startsWith(matrix.platform,'android')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          df -h
          sudo rm -rf /opt/ghc
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
          rm -rf ~/.gradle/caches
          df -h
          sudo apt-get autoremove -y
          df -h
          sudo apt-get clean 
          df -h
          tree
      
      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      # - name: Setup NDK
      #   if: startsWith(matrix.platform,'android')
      #   uses: nttld/setup-ndk@v1
      #   id: setup-ndk
      #   with:
      #     ndk-version: ${{ env.NDK_VERSION }}
      #     add-to-path: true
      #     link-to-sdk: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: startsWith(matrix.platform,'android')
        with:
          # default also installs the legacy 'tools' package, which no longer exists
          packages: platform-tools
      # - name: Cache Android SDK
      #   uses: actions/cache@v5
      #   if: startsWith(matrix.platform,'android')
      #   with:
      #     path: |
      #       /usr/local/lib/android/sdk
      #     key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
      #     restore-keys: |
      #       android-sdk-${{ runner.os }}-      
      - name: Cache Gradle
        uses: actions/cache@v5
        if: startsWith(matrix.platform,'android')

        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
                  
      - name: Setup dependencies
        run: |
          make ${{ matrix.platform }}-install-deps  
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Android Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'android') }}
        # A called workflow may only use "inputs" in an "if", so the secret
        # is checked inside the step. Without a key the build still runs, it
        # just produces an unsigned artifact.
        env:
          HAS_KEY: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "no Android signing key, building unsigned"
            exit 0
          fi
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Setup Windows Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        # A called workflow may only use "inputs" in an "if", so the secret
        # is checked inside the step. Without a certificate the build still
        # runs, it just produces an unsigned artifact.
        env:
          HAS_CERT: ${{ secrets.WINDOWS_SIGNING_KEY != '' }}
        run: |
            if ($env:HAS_CERT -ne "true") {
                Write-Host "no Windows signing certificate, building unsigned"
                exit 0
            }
            [IO.File]::WriteAllBytes("windows\sign.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_KEY }}"))
            (Get-Content "windows\packaging\msix\make_config.yaml") -replace '^certificate_password:.*$', 'certificate_password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}' | Set-Content "windows\packaging\msix\make_config.yaml"
            # Fail early with a readable reason instead of SignTool's "No certificates were found"
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("windows\sign.pfx", "${{ secrets.WINDOWS_SIGNING_PASSWORD }}")
            Write-Host "Signing cert: $($cert.Subject) thumbprint=$($cert.Thumbprint) valid $($cert.NotBefore) -> $($cert.NotAfter)"
            if (-not $cert.HasPrivateKey) { throw "WINDOWS_SIGNING_KEY has no private key" }
            if ($cert.NotAfter -lt (Get-Date)) { throw "Windows signing certificate expired on $($cert.NotAfter); update WINDOWS_SIGNING_KEY / WINDOWS_SIGNING_PASSWORD / WINDOWS_SIGNING_SHA1" }
            if ("${{ secrets.WINDOWS_SIGNING_SHA1 }}" -and $cert.Thumbprint -ne "${{ secrets.WINDOWS_SIGNING_SHA1 }}".ToUpper()) { Write-Warning "WINDOWS_SIGNING_SHA1 does not match the certificate thumbprint" }

      # - name: Temporary disable Permission Handler for windows due to its issue in permission
      #   if: ${{ startsWith(matrix.platform,'windows') }}
      #   run: |
      #     (Get-Content -Path "pubspec.yaml") -notmatch "permission_handler" | Set-Content -Path "pubspec.yaml"
      #     (Get-Content -Path "lib\features\profile\add\add_profile_modal.dart") -notmatch "qr_code_scanner_screen" | Set-Content -Path "lib\features\profile\add\add_profile_modal.dart"
      #     (Get-Content -Path lib\features\profile\add\add_profile_modal.dart) -replace 'await QRCodeScannerScreen\(\).open\(context\);', 'null;' | Set-Content -Path lib\features\profile\add\add_profile_modal.dart
      #     Remove-Item -Path "lib\features\common\qr_code_scanner_screen.dart"




      - name: Download core
        # The core was built by the "core" job from our own submodule. The
        # app is linked against that build, so the Nerpa core changes are
        # part of the shipped binary.
        uses: actions/download-artifact@v4
        with:
          name: core-${{ matrix.core_artifact }}
          path: hiddify-core/bin

      - name: Prepare for ${{ matrix.platform }}
        run: |
          make ${{ matrix.platform }}-prepare


      - name: Build ${{ matrix.platform }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          make ${{ matrix.platform }}-release

      - name: Code Sign
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        # signtool-code-sign actions hardcode an SDK path (10.0.17763.0) missing on current runners,
        # so locate signtool from whichever Windows SDK is installed.
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          HAS_CERT: ${{ secrets.WINDOWS_SIGNING_KEY != '' }}
        run: |
          if ($env:HAS_CERT -ne "true") {
            Write-Host "no Windows signing certificate, skipping the signing"
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "Using $($signtool.FullName)"
          $pfx = Resolve-Path "windows\sign.pfx"
          $exts = '.dll','.exe','.sys','.msix','.msixbundle','.appx','.appxbundle','.msi','.msp','.msm','.cab','.ps1','.psm1'
          $files = Get-ChildItem dist -Recurse -File | Where-Object { $exts -contains $_.Extension.ToLower() }
          foreach ($file in $files) {
            Write-Host "Signing $($file.FullName)"
            $ok = $false
            foreach ($attempt in 1..5) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d Hiddify /f $pfx /p $env:SIGN_PASSWORD $file.FullName
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds $attempt
            }
            if (-not $ok) { throw "failed to sign $($file.FullName)" }
          }

      - name: Copy to out Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          $targets = "${{ matrix.targets }}".Split(',')
          foreach ($ext in $targets) {
            $ext = $ext.Trim()
            $key = "TARGET_NAME_$ext"
            $targetName = (Get-Item "env:$key").Value
            
            $files = Get-ChildItem -Path dist -Recurse -Filter "*.$ext"
            
            foreach ($file in $files) {
                $destination = Join-Path -Path "out" -ChildPath "$targetName.$ext"
                Move-Item -Path $file.FullName -Destination $destination -Force
            }
          }
          Get-ChildItem -Path out
          
      - name: Upload Debug Symbols
        if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ matrix.platform == 'android-aab' && 'google-play' || 'general' }}
        run: |
          dart pub global activate sentry_dart_plugin
          dart run sentry_dart_plugin 
      
      

              
      - name: Copy to out Android APK
        if: matrix.platform == 'android-apk'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/flutter-apk/*arm64-v8a*.apk out/${TARGET_NAME_apk}-arm64.apk || echo "no arm64 apk"
          cp ./build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/${TARGET_NAME_apk}-arm7.apk || echo "no arm7 apk"
          cp ./build/app/outputs/flutter-apk/*x86_64*.apk out/${TARGET_NAME_apk}-x86_64.apk || echo "no x64 apk"
          cp ./build/app/outputs/flutter-apk/app-release.apk out/${TARGET_NAME_apk}-universal.apk || echo "no universal apk"

      - name: Copy to out Android AAB
        if: matrix.platform == 'android-aab'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/bundle/release/app-release.aab out/hiddify-android-market.aab || echo "no aab"

      - name: Copy to out unix
        if: startsWith(matrix.platform,'linux') || matrix.platform == 'macos' || matrix.platform == 'ios'
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          
          for EXT in $(echo ${{ matrix.targets }} | tr ',' '\n'); do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            [[ "$EXT" != "gz" ]] && chmod +x tmp_out/${FILENAME}.$EXT || echo "Skipping chmod for gz"
            if [ "${{matrix.platform}}" == "linux" ];then
              cp ./.github/help/linux/* tmp_out/
            else
              cp ./.github/help/mac-windows/* tmp_out/
            fi
            if [[ "${{matrix.platform}}" == 'ios' ]];then
              echo mv tmp_out/${FILENAME}.$EXT out/
              mv tmp_out/${FILENAME}.$EXT out/
            else
              cd tmp_out
              # 7z a ${FILENAME}.zip ./
              # mv ${FILENAME}.zip ../out/
              # [[ $EXT == 'AppImage' ]]&& mv ${FILENAME}.$EXT ../out/ # added for appimage link
              mv ${FILENAME}.$EXT ../out/
              cd ..
            fi
          done

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.platform}}
          path: ./out
          retention-days: 1

      - name: Clean up keychain and provisioning profile
        if: ${{ always() && startsWith(matrix.os,'macos')}}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db ||echo ok
          rm ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision ||echo ok
  update-draft:
    permissions: write-all
    if: ${{ inputs.upload-artifact }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          # by default, it uses a depth of 1
          # this fetches all history so that we can read each commit
          fetch-depth: 0
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/
          

      - name: Display Files Structure
        run: ls -R
        working-directory: ./out

      - name: Delete Current Release Assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'draft'
          deleteOnlyFromDrafts: false
          
      - name: prepare_release_message
        continue-on-error: true
        run: |
          set +e 
          sed 's|RELEASE_TAG|${{ env.TAG_NAME }}|g' ./.github/release_message.md > release.md
          pip install gitchangelog pystache mustache markdown
          prelease=$(curl --silent "https://api.github.com/repos/hiddify/hiddify-app/releases/latest" | grep -Po '"tag_name": "\K([^"]*)') 
          echo -e "\n\n<details markdown=1><summary>All changes from $current to the latest commit:</summary>\n\n">>release.md
          gitchangelog "${prelease}.." >> release.md  2>&1 || echo "Error in gitchangelog"
          echo -e "\n\n</details>">>release.md
      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/*
          name: 'draft'
          tag_name: 'draft'
          body_path: './release.md'
          prerelease: true

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v3
        # env:
          #GITHUB_TOKEN: ${{ secrets.TOKEN_FOR_HIDDIFY_APP_REPO }}
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#          GITHUB_REPOSITORY: hiddify/hiddify-app
        with:
          files: ./out/*
          name: 'draft'
          tag_name: 'draft'
          body_path: './release.md'
          target_commitish: ${{ github.sha }}
          # target_commitish: '530bf77839a74d4f13847ba244a20734ac7ab119'
          prerelease: true
          # repository: hiddify/hiddify-app

  upload-release:
    permissions: write-all
    if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/

      - name: Display Files Structure
        run: |
          ls -R ./out
          ls -R ./.github/
          ls -R ./.git/
          mv out/hiddify-android-market.aab  hiddify-android-market.aab

      - name: prepare_release_message
        run: |
          sed 's|RELEASE_TAG|${{ env.TAG_NAME }}|g' ./.github/release_message.md >> release.md

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # prerelease: ${{ env.CHANNEL == 'dev' }}
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          body_path: './release.md'
          files: ./out/*

      - name: Create service_account.json
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Deploy to Google Play Internal Testers
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: app.hiddify.com
          releaseName: ${{ env.TAG_NAME }}
          releaseFiles: ./hiddify-android-market.aab
          track: 'beta'


  upload-to-testflight:
    needs: [build]
    if: ${{ inputs.upload-artifact &&  inputs.tag-name != 'draft' }}
    #if: ${{ inputs.upload-artifact }}
    runs-on: macOS-latest
    timeout-minutes: 30
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*ios*"
          path: ./out/

      - uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_UPLOAD_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: app.hiddify.com
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: app.hiddify.com.SingBoxPacketTunnel
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
  


      - name: Import Apple Mobile Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{secrets.APPLE_DIST_PROVISIONING_PROFILES_TARGZ_BASE64}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
        #echo "${{secrets.NEW_APPLE_STORE_PROVISIONING_PROFILES_TARXZ_BASE64}}"|base64 --decode | tar xJ -C ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: Apple-Actions/upload-testflight-build@v4
        with:
          app-path: 'out/Hiddify-iOS.ipa' 
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
